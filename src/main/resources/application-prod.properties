spring.application.name=tareas-app

server.port=${PORT:8080}

# Confia en X-Forwarded-* solo porque el unico acceso es Cloudflare Tunnel
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
app.h2-console.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never

logging.level.com.tareas.app=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.file.name=
logging.file.path=

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:https://donit-api.marfern.dev}
jwt.audience=${JWT_AUDIENCE:tareas-app}

# ===============================
# Manejo de errores en produccion
# ===============================
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# Limites de peticiones HTTP (proteccion ante abuso)
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
