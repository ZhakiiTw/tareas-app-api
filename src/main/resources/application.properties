# Nombre de como se va a llamar la app desde este proyecto de intellij
spring.application.name=tareas-app

# Configuracion de H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion de la consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.cors.allowed-origins=http://localhost:4200
app.h2-console.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# Configuracion de Logs
# ===============================
logging.level.com.tareas.app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Guardar logs en archivo
logging.file.name=logs/tareas-app.log
logging.file.path=logs

# Formato de los logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Rotacion de archivos (opcional)
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# ===============================
# Configuracion JWT
# ===============================

# Clave codeada en Base64 para firmar los tokens (Base64)
jwt.secret=dGFyZWFzLWFwcC10ZXN0LXNlY3JldC1nZW5lcmljby0yMDI2LXBhcmEtdGVzdHMtdW5pdGFyaW9z

# Tiempo de expiracion del token (milisegundos)
# 86400000 = 24 horas
jwt.expiration=86400000
