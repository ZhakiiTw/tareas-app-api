name: nvd-database-update

# Actualiza la base NVD de OWASP Dependency-Check y ejecuta el escaneo de
# Dependency-Check. Workflow NO bloqueante: si falla (NVD caida, rate-limit, ...)
# falla SOLO este workflow y NUNCA bloquea los Pull Requests.
#
# Disparadores:
#   - schedule: semanal (lunes 04:00 UTC) -> mantenimiento automatico.
#   - workflow_dispatch: ejecucion manual.
#
# Flujo:
#   1. Restaura la cache anterior como baseline (actualizacion incremental).
#   2. dependencyCheckUpdate: descarga/actualiza NVD (+ KEV, suppressions, RetireJS).
#   3. Guarda la cache NVD SOLO si la actualizacion termino con exit 0 (nunca una
#      DB parcial).
#   4. dependencyCheckAnalyze (autoUpdate=false): genera los reportes con la DB
#      recien actualizada y los sube como artifact.
#
# Nota: el escaneo de PR (security-scan.yml) usa OSV-Scanner y NO depende de esta
# cache ni de NVD.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  update-nvd:
    runs-on: ubuntu-latest
    # La primera descarga completa puede tardar bastante (NVD ~374.000 CVEs).
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Extract Dependency-Check version
        id: dc-version
        run: |
          VERSION=$(sed -n "s/.*org\.owasp\.dependencycheck' version '\([0-9][0-9.]*\)'.*/\1/p" build.gradle)
          if [ -z "$VERSION" ]; then
            echo "ERROR: no se pudo extraer la version del plugin org.owasp.dependencycheck de build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check NVD API key availability
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is NOT available" >&2
            exit 1
          fi
          echo "NVD_API_KEY is available"

      - name: Restore previous NVD cache (baseline for incremental update)
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/dependency-check-data
          # La key nunca coincide en restore (incluye run_id/run_attempt de ESTA
          # ejecucion); se restaura la cache mas reciente mediante restore-keys.
          # En el primer arranque no hay cache y se descarga la NVD completa.
          key: dependency-check-${{ runner.os }}-${{ steps.dc-version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ steps.dc-version.outputs.version }}-
            dependency-check-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update NVD database (dependencyCheckUpdate)
        run: ./gradlew dependencyCheckUpdate --console=plain

      - name: Verify NVD database before caching
        id: verify-nvd-db
        run: |
          DB=$(find "$HOME/.gradle/dependency-check-data" -name 'odc.mv.db' -size +50M -print -quit 2>/dev/null)
          if [ -z "$DB" ]; then
            echo "::error::La base NVD (odc.mv.db) no existe o es demasiado pequena tras dependencyCheckUpdate. No se guarda ninguna cache."
            exit 1
          fi
          echo "NVD database OK: $DB"

      - name: Save NVD cache (only if the update succeeded)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ steps.dc-version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: OWASP Dependency-Check analyze (autoUpdate disabled, report only)
        run: ./gradlew dependencyCheckAnalyze --console=plain

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check/
          retention-days: 30
