name: security-scan

# Analisis de seguridad de cada Pull Request. No depende de NVD ni de ninguna
# cache pesada: genera el SBOM, lo escanea con OSV-Scanner (gate obligatorio del
# PR) y ejecuta tests + build.
#
# El escaneo OWASP Dependency-Check se ejecuta por separado y de forma NO
# bloqueante en nvd-update.yml (semanal/manual), que es el unico lugar donde se
# descarga/actualiza la base NVD.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: SBOM CycloneDX
        run: ./gradlew cyclonedxDirectBom --console=plain

      - name: OSV-Scanner (gate obligatorio de PR)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v2.4.0 \
            scan \
            --experimental-exclude=/src/build --experimental-exclude=/src/.gradle \
            --format=json --output-file=/src/build/reports/osv-scanner/osv-results.json \
            /src/build/reports/cyclonedx-direct/bom.json
          python3 - <<'PY'
          import json, sys
          path = "build/reports/osv-scanner/osv-results.json"
          with open(path) as f:
              data = json.load(f)
          vulns = []
          for r in data.get("results", []):
              for p in r.get("packages", []):
                  pkg = p.get("package", {})
                  for v in p.get("vulnerabilities", []):
                      vulns.append((v.get("id"), pkg.get("name"), pkg.get("version")))
          if vulns:
              print("::error::OSV-Scanner encontro vulnerabilidades confirmadas:")
              for vid, name, ver in vulns:
                  print(f"::error::  - {vid} {name}@{ver}")
              sys.exit(1)
          print("OSV-Scanner: 0 vulnerabilidades")
          PY

      - name: Tests
        run: ./gradlew test --console=plain

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/osv-scanner/
            build/reports/cyclonedx-direct/
          retention-days: 14
